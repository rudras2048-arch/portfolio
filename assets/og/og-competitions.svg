      <rect x="0" y="0" width="254" height="4" fill="#A5BA28" opacity="0.9" rx="2" />
      <text x="20" y="38" class="font-mono" font-size="11" font-weight="600" fill="#A5BA28" letter-spacing="1">3RD PLACE PODIUM</text>
      <text x="20" y="75" class="font-display" font-size="18" fill="#F5EFE6">Advertising &amp; Brand Pitch</text>
