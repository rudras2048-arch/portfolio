      <text x="20" y="38" class="font-mono" font-size="11" font-weight="600" fill="#A5BA28" letter-spacing="1">TOP 5 NATIONAL FINALIST</text>
      <text x="20" y="75" class="font-display" font-size="18" fill="#F5EFE6">CINE-SELL Brand Challenge</text>
