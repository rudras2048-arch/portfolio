# ============================================================================
# Netlify Deployment Configuration — Rudra Sharma Portfolio v2
# Domain: rudras-portfolio.netlify.app
# Build: node scripts/build.js → dist/
# ============================================================================

[build]
  publish = "dist"
  command = "node scripts/build.js"

[build.environment]
  NODE_VERSION = "20"

# ----------------------------------------------------------------------------
# Security & Performance Headers
# ----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Explicit Crawler / AI Retrieval Opt-In
    X-Robots-Tag = "all"
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Content Security Policy — inline styles/scripts needed for SSG output
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none'; frame-ancestors 'none';"
    # HSTS (1 year, include subdomains)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# Long-term cache for versioned assets (images, fonts, PDF)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No-cache for HTML (always fetch fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sitemap, robots.txt, and llms.txt — explicit crawler-friendly headers
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
